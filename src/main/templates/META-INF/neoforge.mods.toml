    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="[19.2.18,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="megacells"
    type="required"
    versionRange="[4.11.0,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="insaneae"
    type="required"
    versionRange="[1.1.2,)"
    ordering="NONE"
    side="BOTH"

